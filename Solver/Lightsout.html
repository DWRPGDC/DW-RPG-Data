<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle Solver</title>
<style>
  :root {
    --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;
    --border:#ddd;--border2:#ccc;
    --text:#1a1a1a;--text2:#444;--text3:#888;
    --gold:#7a5c10;--gold2:#5a4008;
    --red:#b03020;--red2:#8c2010;
    --green:#2e6b2e;--green2:#1e4e1e;
    --radius:6px;
    --font-ui:'Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;padding:16px}
  .wrap{max-width:480px;margin:0 auto}

  .intro{
    font-size:13px; line-height:1.6; color:var(--text2);
    margin-bottom:14px; padding:10px 12px;
    background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius);
  }
  .intro:empty{display:none}

  .panel{
    background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px;
  }
  .row-label{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}

  .grid{display:flex;gap:8px;justify-content:center;margin:6px 0 16px;flex-wrap:nowrap}
  .cell{
    flex:1 1 0;max-width:48px;aspect-ratio:1;border-radius:50%;
    border:2px solid var(--border2);
    background:radial-gradient(circle at 35% 30%, #f8f8f8, #d8d8d8 75%);
    cursor:pointer;transition:transform .08s,box-shadow .15s,background .15s,border-color .15s;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .cell .order{
    font-size:13px;font-weight:800;color:var(--gold2);text-shadow:0 0 3px rgba(255,255,255,.8);
  }
  .instructions{
    margin-top:12px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);
    border-radius:var(--radius);font-size:13px;line-height:1.7;color:var(--text);display:none;
  }
  .instructions.show{display:block}
  .instructions b{color:var(--gold2)}
  .cell:active{transform:scale(.92)}
  .cell.on{
    background:radial-gradient(circle at 35% 30%, #ffe9a8, #e8c468 55%, #b8892a 100%);
    border-color:var(--gold);
    box-shadow:0 0 10px rgba(122,92,16,.35);
  }
  .cell.hint::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;
    border:2px solid var(--green);box-shadow:0 0 0 2px rgba(46,107,46,.15);
  }

  .btnrow{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:96px;padding:9px 12px;border-radius:var(--radius);
    border:1px solid var(--border2);background:var(--bg3);color:var(--text);
    font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-ui);
    transition:border-color .12s,color .12s;
  }
  .btn:hover{border-color:var(--gold);color:var(--gold2)}
  .btn.primary{background:var(--gold);color:#fff;border-color:var(--gold)}
  .btn.primary:hover{background:var(--gold2);border-color:var(--gold2);color:#fff}

  .status{margin-top:12px;font-size:12px;color:var(--text3);line-height:1.5;min-height:16px}
  .status.solved{color:var(--green2);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="intro" id="intro-text">You can use this solver to help solve the puzzle above. Tap the buttons here to match the current state of the real puzzle, then hit Solve — it'll ring the ones you need to click in green.</div>

  <div class="panel">
    <div class="row-label">Tap to match the current state, then Solve</div>
    <div class="grid" id="grid"></div>
    <div class="btnrow">
      <button class="btn primary" onclick="solvePuzzle()">Solve</button>
      <button class="btn" onclick="clearGrid()">Clear all off</button>
    </div>
    <div class="status" id="status">Set the board to match the real puzzle, then tap Solve.</div>
    <div class="instructions" id="instructions"></div>
  </div>
</div>

<script>
// Fixed 1x7 row. Standard Lights Out rule: clicking a light toggles ITSELF
// and its immediate left/right neighbors — matches the real in-game puzzle.
const COUNT = 7;
let state = Array(COUNT).fill(false);
let solutionOrder = []; // array of indices in the order to click, or null

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = '';
  for(let i=0;i<COUNT;i++){
    const d = document.createElement('div');
    const stepNum = solutionOrder.indexOf(i);
    d.className = 'cell' + (state[i] ? ' on' : '') + (stepNum!==-1 ? ' hint' : '');
    d.dataset.i = i;
    if(stepNum!==-1){
      const s = document.createElement('span');
      s.className = 'order';
      s.textContent = stepNum+1;
      d.appendChild(s);
    }
    d.onclick = ()=>toggleCell(i);
    g.appendChild(d);
  }
}

// Editing the board to MATCH the real puzzle's current state — this only
// flips the one light you tap, it does not simulate the real neighbor rule.
function toggleCell(i){
  state[i] = !state[i];
  solutionOrder = [];
  renderGrid();
  setStatus('Board edited. Tap Solve when ready.', '');
  hideInstructions();
}

function clearGrid(){
  state = Array(COUNT).fill(false);
  solutionOrder = [];
  renderGrid();
  setStatus('Set the board to match the real puzzle, then tap Solve.', '');
  hideInstructions();
}

function setStatus(msg, cls){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = 'status' + (cls ? ' '+cls : '');
}

function hideInstructions(){
  const box = document.getElementById('instructions');
  box.classList.remove('show');
  box.innerHTML = '';
}

// Solve via Gaussian elimination over GF(2): find which of the 7 buttons
// need to be clicked (each click toggles itself + left/right neighbor)
// so that every light ends up off.
function solvePuzzle(){
  const n = COUNT;
  const idx = i=>i;
  const A = [];
  for(let r=0;r<n;r++){
    const row = new Uint8Array(n+1);
    [r-1,r,r+1].forEach(c=>{ if(c>=0&&c<n) row[c]=1; });
    // Goal is ALL LIT UP, so the required change at this light is the
    // opposite of its current state (on lights need 0 net change, off need 1)
    row[n] = state[r] ? 0 : 1;
    A.push(row);
  }

  let pivotRow = 0;
  const pivotCols = [];
  for(let col=0; col<n && pivotRow<A.length; col++){
    let sel=-1;
    for(let rr=pivotRow; rr<A.length; rr++){ if(A[rr][col]===1){ sel=rr; break; } }
    if(sel===-1) continue;
    [A[pivotRow],A[sel]]=[A[sel],A[pivotRow]];
    for(let rr=0; rr<A.length; rr++){
      if(rr!==pivotRow && A[rr][col]===1){
        for(let cc=col; cc<=n; cc++) A[rr][cc] ^= A[pivotRow][cc];
      }
    }
    pivotCols.push(col);
    pivotRow++;
  }

  for(let rr=pivotRow; rr<A.length; rr++){
    if(A[rr][n]===1){
      solutionOrder = [];
      renderGrid();
      setStatus('No exact solution for this state. Double-check the board matches the real puzzle.', '');
      hideInstructions();
      return;
    }
  }

  const x = new Array(n).fill(0);
  for(let i=0;i<pivotCols.length;i++) x[pivotCols[i]] = A[i][n];

  const clicks = [];
  for(let i=0;i<n;i++) if(x[i]===1) clicks.push(i);

  solutionOrder = clicks;
  renderGrid();

  if(clicks.length===0){
    setStatus('This board is already all lit up — no clicks needed!', 'solved');
    hideInstructions();
    return;
  }

  setStatus(`Solution found: ${clicks.length} click${clicks.length===1?'':'s'} needed.`, 'solved');

  const box = document.getElementById('instructions');
  const ordinal = ['1st','2nd','3rd','4th','5th','6th','7th'];
  const steps = clicks.map((c,i)=>`<b>${ordinal[i]||(i+1)+'th'}:</b> click button #${c+1}`).join('<br>');
  box.innerHTML = 'On the real puzzle, click in this order:<br>' + steps;
  box.classList.add('show');
}

renderGrid();
</script>
</body>
</html>
