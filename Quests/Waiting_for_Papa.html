<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Waiting for Papa</title>
<style>
:root{--bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;--border:#ddd;--border2:#ccc;--text:#1a1a1a;--text2:#444;--text3:#888;--gold:#7a5c10;--tab-h:52px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}
*:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button,a,summary,[onclick],.choice-btn,.bchoice,.tchoice-label,.subchoice{transition:filter .15s ease}
button:active,a:active,summary:active,[onclick]:active,.choice-btn:active,.bchoice:active,.tchoice-label:active,.subchoice:active{filter:brightness(.85);transition:filter .03s ease}
body{background:var(--bg);color:var(--text);font-family:sans-serif;font-size:14px;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#app{display:flex;flex:1;overflow:hidden}
#branch-panel{width:100%;display:flex;flex-direction:column;overflow:hidden}
#branch-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);flex-shrink:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;scroll-behavior:smooth}
#branch-header::-webkit-scrollbar{display:none}
#back-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;display:none;align-items:center;gap:4px;text-decoration:none;font-family:sans-serif;flex-shrink:0}
#back-btn.visible{display:inline-flex}
#back-btn:hover{background:var(--bg3);color:var(--text)}
.panel-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);flex:0 0 auto;white-space:nowrap}
#mode-toggle{display:flex;border:1px solid var(--border2);border-radius:5px;overflow:hidden;flex-shrink:0}
#mode-toggle button{background:none;border:none;padding:5px 12px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:background .12s,color .12s;white-space:nowrap}
#mode-toggle button.active{background:var(--gold);color:#fff8ee}
#best-route-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;flex-shrink:0}
#best-route-btn:hover{background:var(--bg3);color:var(--text)}
#best-route-btn.active-normal{background:#fff0ee;border-color:#e03020;color:#b02010}
#best-route-btn.active-important{background:#e03020;border-color:#b02010;color:#fff8ee}
.ellipsis-card{text-align:center;color:var(--text3);font-size:20px;letter-spacing:4px;padding:8px 0;user-select:none}
#collapse-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s;display:none;flex-shrink:0}
#collapse-btn.visible{display:inline-flex;align-items:center;gap:4px}
#branch-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;min-width:0;padding:12px 12px 40px;container-type:inline-size}
#sim-fab{position:fixed;bottom:24px;right:24px;z-index:400;width:68px;height:68px;border-radius:50%;background:var(--gold);border:none;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:background .15s,transform .15s;padding:0}
#sim-fab:hover{background:#6b5010;transform:scale(1.07)}
#sim-fab .fab-icon{font-size:22px;line-height:1;color:#fff8ee}
#sim-fab .fab-label{font-size:7px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff8ee;text-align:center;line-height:1.2;max-width:58px}
#sim-modal{display:none;position:fixed;inset:0;z-index:450;align-items:center;justify-content:center;padding:20px}
#sim-modal.open{display:flex}
#sim-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#sim-box{position:relative;background:var(--bg);border:1px solid var(--border2);border-radius:12px;width:460px;max-width:100%;max-height:90dvh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 48px rgba(0,0,0,.28);z-index:1}
#play-header{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--bg2);flex-shrink:0}
#play-title{font-size:13px;font-weight:700;color:var(--gold);font-family:sans-serif;letter-spacing:.07em;text-transform:uppercase;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sim-header-actions{display:flex;align-items:center;gap:6px}
#restart-btn{background:transparent;border:1px solid var(--border2);color:var(--text2);font-family:sans-serif;font-size:12px;padding:5px 12px;border-radius:5px;cursor:pointer;white-space:nowrap}
#restart-btn:hover{border-color:var(--text);color:var(--text)}
#sim-close{background:none;border:none;font-size:20px;color:var(--text3);cursor:pointer;line-height:1;padding:2px 6px;border-radius:4px;min-width:30px;min-height:30px;display:flex;align-items:center;justify-content:center}
#sim-close:hover{color:var(--text);background:var(--bg3)}
#play-body{flex:1;overflow-y:auto;padding:22px 24px 40px;font-family:Georgia,serif;font-size:16px;line-height:1.8;color:var(--text)}
#scene-title{font-size:11px;font-weight:700;font-family:sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);margin-bottom:10px}
#scene-text{line-height:1.8;margin-bottom:18px;white-space:pre-wrap}
#scene-embed{margin-bottom:18px}
#scene-embed iframe{width:100%;min-height:420px;border:1px solid var(--border2);border-radius:8px;display:block}
.tembed-wrap{margin:4px 0 8px;border:1px solid var(--border2);border-radius:6px;overflow:hidden}
.tembed-wrap summary{cursor:pointer;padding:6px 10px;font-size:11px;font-weight:700;background:rgba(0,0,0,.04);list-style:none;user-select:none}
.wiki-list{margin:6px 0;padding-left:22px}
.wiki-list li{margin-bottom:3px;line-height:1.6}
.tembed-wrap summary::-webkit-details-marker{display:none}
.tembed-wrap[open] summary{border-bottom:1px solid var(--border2)}
.tembed-wrap iframe{margin:0!important;border:none!important;border-radius:0!important;display:block}
#dialogues{margin-bottom:4px}
.dlg-visible{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;margin-bottom:10px;overflow:hidden;padding:10px 14px}
.dlg-vis-spk{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:6px}
.bbody .dlg-visible{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 8px;margin-bottom:4px}
.bbody .dlg-vis-spk{font-size:10px;margin-bottom:2px}
.bbody .dlg-visible .dlg-text{font-size:11px;color:var(--text2);border-top:none;padding:0}
.dlg-vis-spk{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);margin-bottom:6px}
details{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;margin-bottom:10px;overflow:hidden}
summary{cursor:pointer;padding:10px 14px;font-family:sans-serif;font-size:13px;font-weight:600;color:var(--gold);list-style:none;display:flex;align-items:center;gap:6px}
summary::before{content:"\25B6";font-size:9px}
details[open] summary::before{content:"\25BC"}
summary::-webkit-details-marker{display:none}
.dlg-text{padding:10px 14px 12px;font-size:14px;line-height:1.7;color:var(--text2);border-top:1px solid var(--border);white-space:pre-wrap}
#choices{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:Georgia,serif;font-size:15px;padding:12px 16px;cursor:pointer;text-align:left;transition:background .12s,border-color .12s,color .12s;min-height:46px;width:100%;display:flex;align-items:center;gap:10px}
.choice-btn:hover,.choice-btn:active{background:var(--bg3);border-color:var(--gold);color:var(--gold)}
.choice-btn.best{background:#fff0ee;border-color:#e03020}
.choice-btn.best:hover,.choice-btn.best:active{background:#ffe8e4;border-color:#c02010;color:var(--gold)}
.choice-btn-label{flex:1}
.choice-btn-badge{display:inline-flex;align-items:center;gap:3px;background:#e03020;color:#fff8ee;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:10px;flex-shrink:0;font-family:sans-serif}
.choice-itemreq{font-size:11px;color:#7a5a18;background:#fff0ee;border:1px solid #d4b870;border-radius:4px;padding:3px 8px;margin:-4px 0 2px;display:inline-block;font-family:sans-serif}
.bchoice-itemreq{font-size:10px;color:#7a5a18;background:#fff0ee;border:1px solid #d4b870;border-radius:3px;padding:1px 6px;margin-top:2px;flex-basis:100%;white-space:normal;word-break:break-word;font-family:sans-serif}
.tchoice-itemreq{font-size:10px;color:#7a5a18;background:#fff0ee;border:1px solid #d4b870;border-radius:3px;padding:1px 6px;margin-top:2px;flex-basis:100%;white-space:normal;word-break:break-word;font-family:sans-serif}
.tchoice-label-text{flex:1 1 auto;min-width:80px;word-break:break-word}
.ending-msg{text-align:center;padding:24px 0 8px;color:var(--text3);font-family:sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
#reward-box{background:#f0e8d0;border:1px solid #c8b870;border-radius:6px;padding:11px 16px;margin-top:12px;display:none;flex-direction:column;gap:6px}
.reward-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#7a5a18}
.reward-items{display:flex;flex-wrap:wrap;gap:8px}
.reward-item{display:flex;align-items:center;gap:5px;background:#e8d8b8;border:1px solid #c8b870;border-radius:4px;padding:4px 10px}
.reward-item img{width:20px;height:20px;object-fit:contain;image-rendering:pixelated}
.reward-item-name{font-size:12px;font-weight:600;color:#4a3810}
.reward-item-qty{font-size:14px;color:#4a3810;font-family:Georgia,serif}
#unlocks-box{background:#e8f0e8;border:1px solid #9ab89a;border-radius:6px;padding:11px 16px;margin-top:8px;display:none;flex-direction:column;gap:3px}
.unlocks-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#2e6b2e}
.unlocks-text{font-size:14px;color:#1e4e1e;line-height:1.6}
.unlocks-text a{color:#2e6b2e;text-decoration:underline;text-underline-offset:2px}
.bscene{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;margin-bottom:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s;scroll-margin-top:10px}
.bscene.playing{border-color:var(--gold);box-shadow:0 0 0 2px rgba(138,106,24,.2)}
.bscene.has-best{border-left:3px solid #e03020}
.bscene.has-best.playing{border-color:var(--gold);border-left-color:#e03020}
.bhead{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--border);background:var(--bg3)}
.bbadge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:4px;flex-shrink:0}
.b-start{background:#c8e8c8;color:#1e4e1e}
.b-scene{background:#ddd0ee;color:#3e2458}
.b-ending{background:#f0d8c8;color:#7a3a18}
.btitle{font-size:13px;font-weight:600;color:var(--gold);flex:1}
.bid{font-size:10px;color:var(--text3);font-family:monospace}
.bplay-btn{background:var(--gold);border:none;color:#fff8ee;font-size:10px;font-weight:700;padding:4px 9px;border-radius:4px;cursor:pointer;flex-shrink:0}
.bplay-btn:hover{background:#6b5010}
.bbody{padding:9px 11px;font-size:12px;line-height:1.6;color:var(--text2)}
.btext{color:var(--text);white-space:pre-wrap;margin-bottom:7px;font-size:12px}
.bdlg-wrap{margin-bottom:7px}
.bchoices{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.bchoice{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:6px 9px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;cursor:pointer;transition:background .12s,border-color .12s}
.bchoice:hover{background:#ddd;border-color:var(--gold)}
.bchoice.best{background:#fff0ee;border-color:#e03020}
.bchoice-arrow{color:var(--text3);font-size:11px}
.bchoice-label{flex:1;min-width:120px;color:var(--text);font-size:11px;font-weight:700;word-break:break-word}
.bchoice-dest{font-size:10px;color:var(--gold);font-weight:600;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}
.best-route-badge{display:inline-flex;align-items:center;gap:3px;background:#e03020;color:#fff8ee;font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:10px;flex-shrink:0}
.choice-btn.best{background:#fff0ee;border-color:#e03020}
.choice-btn.best:hover,.choice-btn.best:active{background:#ffe8e4;border-color:#c02010;color:var(--gold)}
.breward{background:#f0e8d0;border:1px solid #c8b870;border-radius:4px;padding:7px 10px;margin-top:5px;display:flex;flex-direction:column;gap:4px}
.breward-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a5a18;display:block}
.breward-items{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.breward-item{display:flex;align-items:center;gap:5px}
.breward-item img{width:16px;height:16px;object-fit:contain;image-rendering:pixelated}
.breward-item-txt{font-size:12px;color:#4a3810}
.bunlocks{background:#e8f0e8;border:1px solid #9ab89a;border-radius:4px;padding:5px 9px;margin-top:4px;display:flex;gap:7px;align-items:baseline}
.bunlocks-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#2e6b2e;flex-shrink:0}
.bunlocks-text{font-size:11px;color:#1e4e1e;line-height:1.5}
.bunlocks-text a{color:#2e6b2e;text-decoration:underline;text-underline-offset:2px}
.req-box{background:#fff0ee;border:1px solid #d4b870;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#5a4010;line-height:1.5;display:block}
.req-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;color:#7a5a18}
.req-box a{color:#7a5a18;text-decoration:underline}
.loc-box{background:#e8f4f8;border:1px solid #8ab8cc;border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#1a4a5a;line-height:1.5;display:block}
.loc-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px;color:#1a4a5a}
.loc-box a{color:#1a4a5a;text-decoration:underline}
.breq{background:#fff0ee;border:1px solid #d4b870;border-radius:4px;padding:8px 12px;margin-bottom:7px;font-size:13px;color:#5a4010;line-height:1.6;display:block}
.breq-lbl{font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px;color:#7a5a18}
.breq a{color:#7a5a18;text-decoration:underline}
.bloc{background:#e8f4f8;border:1px solid #8ab8cc;border-radius:4px;padding:8px 12px;margin-bottom:7px;font-size:13px;color:#1a4a5a;line-height:1.6;display:block}
.bloc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px;color:#1a4a5a}
.bloc a{color:#1a4a5a;text-decoration:underline}
.treq{background:#fff0ee;border:1px solid #d4b870;border-radius:3px;padding:6px 10px;margin-bottom:5px;font-size:13px;color:#5a4010;line-height:1.6;display:block}
.treq-lbl{font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px;color:#7a5a18}
.treq a{color:#7a5a18;text-decoration:underline}
.tloc{background:#e8f4f8;border:1px solid #8ab8cc;border-radius:3px;padding:6px 10px;margin-bottom:5px;font-size:13px;color:#1a4a5a;line-height:1.6;display:block}
.tloc-lbl{font-size:11px;font-weight:700;text-transform:uppercase;display:block;margin-bottom:3px;color:#1a4a5a}
.tloc a{color:#1a4a5a;text-decoration:underline}
.cnote-box{border:1px solid #7a5c10;border-radius:4px;padding:8px 12px;margin-bottom:7px;font-size:13px;color:var(--text,#1a1a1a);line-height:1.6;display:block}
.cnote-lbl{font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:11px;display:flex;align-items:center;gap:5px;margin-bottom:3px;cursor:pointer;user-select:none}
.cnote-lbl::before{content:"▸";font-size:9px;display:inline-block}
.cnote-box:not(.collapsed) .cnote-lbl::before{content:"▾"}
.cnote-box.collapsed .cnote-lbl{margin-bottom:0}
.cnote-content{display:none}
.cnote-box:not(.collapsed) .cnote-content{display:block}
.cnote-lbl.no-toggle{cursor:default}
.cnote-lbl.no-toggle::before,
.cnote-box:not(.collapsed) .cnote-lbl.no-toggle::before{content:""}
.cnote-box a{text-decoration:underline}
.meta-banner{margin-bottom:8px}
.troot{padding-left:4px;display:table}
.troot-imp{display:block;width:100%;box-sizing:border-box}
.tnode{margin-top:0;display:block}
.tnode-imp{width:100%;max-width:640px;margin:0 auto 10px;box-sizing:border-box}
.tnode-imp .tcard,.tnode-imp .tnode-body{width:100%;box-sizing:border-box}
.tnode-imp .bchoices{width:100%;box-sizing:border-box}
.tnode-imp .bchoice{box-sizing:border-box}
.tcard{display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--bg2);border:1px solid var(--border2);border-radius:6px 6px 0 0;cursor:pointer;transition:border-color .12s,box-shadow .15s;scroll-margin-top:10px;width:clamp(220px,78cqw,340px);box-sizing:border-box}
.tcard:hover{border-color:var(--gold)}
.tcard.playing{border-color:var(--gold);box-shadow:0 0 0 2px rgba(138,106,24,.2)}
.ttitle{font-size:13px;font-weight:600;color:var(--gold);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tnode-body{background:var(--bg2);border:1px solid var(--border2);border-top:none;border-radius:0 0 6px 6px;padding:8px 10px 9px;display:flex;flex-direction:column;gap:6px;width:clamp(220px,78cqw,340px);box-sizing:border-box}
.tree-collapsed .tnode-body{display:none}
.tscene-text{font-size:12px;color:var(--text);line-height:1.55;white-space:pre-wrap}
.tdlgs{display:flex;flex-direction:column;gap:4px}
.tdlg{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 8px;font-size:12px;line-height:1.5}
.tdlg-spk{font-weight:700;color:var(--gold);display:block;margin-bottom:2px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tdlg-txt{color:var(--text2);white-space:pre-wrap}
.tdlgs details{background:var(--bg3);border:1px solid var(--border);border-radius:4px;margin-bottom:4px;font-size:12px}
.tdlgs details summary{padding:5px 8px;font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
.tdlgs details .dlg-text{padding:4px 8px 6px;font-size:12px;border-top:1px solid var(--border)}
.tsub{background:#f5eddc;border:1px solid #d4b870;border-radius:4px;padding:6px 8px;font-size:12px;margin-bottom:4px}
.tsub-title{font-weight:700;color:#7a5a18;font-size:11px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px}
.tsub-text{color:var(--text2);white-space:pre-wrap;margin-bottom:3px}
.bsubs{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.bsub{background:#f5eddc;border:1px solid #d4b870;border-radius:5px;padding:7px 9px;font-size:12px}
.bsub-title{font-weight:700;color:#7a5a18;font-size:11px;text-transform:uppercase;letter-spacing:.03em;display:block;margin-bottom:3px}
.bsub-text{color:var(--text2);white-space:pre-wrap;margin-bottom:3px}
.bsub summary{cursor:pointer;list-style:none}
.bsub summary::-webkit-details-marker{display:none}
.bsub summary::before{content:"▸ ";font-size:9px}
.bsub[open] summary::before{content:"▾ "}
.bsub-inner{margin-top:5px}
.bsub-nodes,.tsub-nodes{display:flex;flex-direction:column;gap:8px}
.bsub-node{background:#fffaf0;border:1px solid #e3d3a8;border-radius:6px;padding:8px 10px}
.tsub-node{background:#fffaf0;border:1px solid #e3d3a8;border-radius:6px;padding:7px 9px}
.bsub-node-name,.tsub-node-name{font-size:10px;font-weight:700;color:#7a5a18;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.tsub summary{cursor:pointer;list-style:none}
.tsub summary::-webkit-details-marker{display:none}
.tsub summary::before{content:"▸ ";font-size:9px}
.tsub[open] summary::before{content:"▾ "}
.tsub-inner{margin-top:4px}
.subchoices{display:flex;flex-direction:column;gap:4px;margin-top:5px}
.subchoice{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:11px}
.subchoice-label{flex:1;min-width:100px;color:var(--text);font-weight:700;word-break:break-word}
.subchoice-dest{font-size:10px;color:var(--gold);font-weight:600;white-space:nowrap}
.bdlg-wrap details{margin-bottom:5px}
.treward-inline{background:#f0e8d0;border:1px solid #c8b870;border-radius:4px;padding:7px 10px;margin-top:4px;display:flex;flex-direction:column;gap:4px}
.treward-inline-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#7a5a18;display:block}
.treward-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#4a3810}
.treward-item img{width:16px;height:16px;object-fit:contain;image-rendering:pixelated}
.tunlocks-inline{font-size:11px;color:#2e6b2e;background:#e8f0e8;border:1px solid #9ab89a;border-radius:3px;padding:3px 8px;margin-top:3px;display:block;line-height:1.5}
.tunlocks-inline a{color:#2e6b2e;text-decoration:underline;text-underline-offset:2px}
.tchoices{margin-left:12px;padding-left:12px;border-left:none;margin-top:6px;display:flex;flex-direction:column;gap:0;position:relative;box-sizing:border-box}
.tchoices.has-best{border-left:none}
.tchoice{position:relative;padding-top:7px;display:flex;flex-direction:column;box-sizing:border-box}
.tc-vert{position:absolute;left:0;width:4px;pointer-events:none;border-radius:1px}
.tc-horiz{position:absolute;left:-12px;top:19px;width:12px;height:2px;pointer-events:none}
.tchoice-label{font-size:13px;font-weight:700;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 11px;margin-bottom:4px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;width:clamp(220px,78cqw,340px);box-sizing:border-box;white-space:normal;word-break:break-word}
.tchoice-label.tchoice-best{background:#fff0ee;border-color:#e03020}
.tcontinue-label{font-size:12px;font-weight:600;font-style:italic;color:#123f62;background:transparent;border:1px dashed #1a5a8a;border-radius:4px;padding:4px 11px;margin-bottom:3px;display:flex;flex-wrap:wrap;align-items:center;gap:5px;width:clamp(220px,78cqw,340px);box-sizing:border-box;white-space:normal;word-break:break-word}
.tcontinue-label.tchoice-best{background:#fff0ee;border-color:#e03020;color:var(--text)}
.tcontinue-label-text::before{content:"↓ ";font-style:normal}
.tchoice-itemreq{font-size:10px;color:#7a5a18;background:#fff0ee;border:1px solid #d4b870;border-radius:3px;padding:1px 6px;margin-top:2px;flex-basis:100%;white-space:normal;word-break:break-word;font-family:sans-serif}
.tchoice-label-text{flex:1 1 auto;min-width:80px;word-break:break-word}
.tvisited{font-size:11px;color:var(--text3);font-style:italic;padding:4px 0 4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;display:block}
.tvisited:hover{color:var(--gold)}
.tmissing{font-size:11px;color:#b03020;padding:4px;font-style:italic}
.tchoice-inline{margin-top:2px;margin-bottom:0;display:flex;flex-direction:column;box-sizing:border-box}
.tchoice-inline>.tchoice-label{display:flex;flex-wrap:wrap;align-self:flex-start;margin-bottom:0;font-size:13px;color:var(--text);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:5px 11px;font-weight:700;white-space:normal;word-break:break-word;width:clamp(220px,78cqw,340px);box-sizing:border-box}
.tchoice-inline>.tchoice-label.tchoice-best{color:var(--text);background:#fff0ee;border-color:#e03020}
@media(orientation:landscape) and (max-width:900px){
.tcard,.tnode-body,.tchoice-label,.tchoice-inline>.tchoice-label,.tcontinue-label{width:80vw;max-width:80vw}
}
@media(min-width:901px){
.tcard,.tnode-body,.tchoice-label,.tchoice-inline>.tchoice-label,.tcontinue-label{width:clamp(420px,52vw,980px);max-width:980px}
}
.tchoice-inline>.tnode{margin-top:10px;display:block}
.tcard-best{border-left:3px solid #e03020!important}
.tnbody-best{border-left:3px solid #e03020!important}
.tcontinue-arrow{font-size:13px;color:var(--text3);padding:2px 0 2px 2px}
@media(max-width:680px){
#app{height:100dvh}
#branch-panel{width:100%;max-width:none;border-right:none}
#branch-body{padding-bottom:100px}
#sim-fab{bottom:20px;right:16px;width:58px;height:58px}
#sim-fab .fab-icon{font-size:18px}
#sim-fab .fab-label{font-size:6.5px}
#sim-box{max-height:92dvh}
#play-body{padding:16px 16px 32px}
}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.obj-icon{width:18px;height:18px;object-fit:contain;image-rendering:pixelated;vertical-align:middle;margin:0 2px;display:inline-block}
#endings-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:background .12s,color .12s,border-color .12s;flex-shrink:0}
#endings-btn:hover{background:var(--bg3);color:var(--text)}
#endings-btn.active{background:var(--gold);color:#fff8ee;border-color:var(--gold)}
.endings-list{display:flex;flex-direction:column;gap:12px}
.endings-list-hint{font-size:11px;color:var(--text3);padding:0 2px 2px;line-height:1.5}
.ending-pick-card{cursor:pointer;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.ending-pick-card:hover{border-color:var(--gold);box-shadow:0 0 0 2px rgba(138,106,24,.15)}
.endings-empty{text-align:center;padding:30px 12px;color:var(--text3);font-size:13px}
.back-to-endings-btn{background:none;border:1px solid var(--border2);border-radius:5px;padding:6px 12px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;margin-bottom:12px;display:inline-flex;align-items:center;gap:4px;font-family:sans-serif}
.back-to-endings-btn:hover{background:var(--bg3);color:var(--text)}
.path-choice{cursor:default}
.path-choice:hover{background:var(--bg3);border-color:var(--border)}
.path-unreachable{text-align:center;padding:24px 12px;color:#b03020;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <div id="branch-panel">
    <div id="branch-header">
      <button id="back-btn" onclick="goBack()">&#8592; Back</button>
      <span class="panel-label">🌿 Branches</span>
      <button id="collapse-btn" onclick="toggleTreeCollapse()">▼ Collapse</button>
      <button id="best-route-btn" onclick="toggleBestRoute()">⭐ Best Route</button>
      <button id="endings-btn" onclick="toggleEndingsMode()">🏁 Endings</button>
      <div id="mode-toggle">
        <button id="btn-tree" class="active" onclick="setBranchMode('tree')">Tree</button>
        <button id="btn-cards" onclick="setBranchMode('cards')">Cards</button>
      </div>
    </div>
    <div id="branch-body"></div>
  </div>
</div>

<!-- Simulate FAB -->
<button id="sim-fab" onclick="openPlay()" title="Simulate Quest">
  <span class="fab-icon">▶</span>
  <span class="fab-label">Simulate</span>
</button>

<!-- Simulate Modal -->
<div id="sim-modal" onclick="if(event.target===this||event.target.id==='sim-overlay')closePlay()">
  <div id="sim-overlay"></div>
  <div id="sim-box">
    <div id="play-header">
      <div id="play-title">Waiting for Papa</div>
      <div id="sim-header-actions">
        <button id="restart-btn" onclick="go('start')">&#8635; Restart</button>
        <button id="sim-close" onclick="closePlay()">&#x2715;</button>
      </div>
    </div>
    <div id="play-body">
      <div id="scene-title"></div>
      <div id="scene-req" class="req-box" style="display:none"></div>
      <div id="scene-loc" class="loc-box" style="display:none"></div>
      <div id="scene-notes" style="display:none"></div>
      <div id="scene-text"></div>
      <div id="scene-embed" style="display:none"></div>
      <div id="dialogues"></div>
      <div id="subscenes"></div>
      <div id="choices"></div>
      <div id="reward-box"><span class="reward-label">&#127873; Reward</span><span class="reward-text" id="reward-text"></span></div>
      <div id="unlocks-box"><span class="unlocks-label">&#128275; Unlocks</span><span class="unlocks-text" id="unlocks-text"></span></div>
    </div>
  </div>
</div>
<script>
const scenes={"start":{"id":"start","type":"start","title":"Waiting for Papa","text":"''A flat boulder sits off the main trail, dusted white. On top of it, a boy no taller than your knee has pulled his knees to his chest and wrapped his arms around them. His lips are blue at the edges.''\n\n''He watches you approach without getting up.''","dialogues":[],"choices":[{"label":"What's wrong?","next":"What_s_wrong_","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[]},"What_s_wrong_":{"id":"What_s_wrong_","type":"scene","title":"","text":"Boy: ''small voice'' I'm waiting for Papa.\n\n''He doesn't uncurl.''\n\nBoy: He told me to wait here. He said he'd come back.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"How long have you been waiting?","next":"How_long_have_you_been_waiting_","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"How_long_have_you_been_waiting_":{"id":"How_long_have_you_been_waiting_","type":"scene","title":"","text":"Boy: ''thinks hard'' Since before the sun was high. Eight hours, maybe. ''shivers'' I'm really cold.\n\n''He presses his forehead to his knees.''\n\nBoy: Papa said not to move. So I didn't.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"Where did your papa go?","next":"Where_did_your_papa_go_","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"Where_did_your_papa_go_":{"id":"Where_did_your_papa_go_","type":"scene","title":"","text":"Boy: ''points one stiff arm up the slope without looking''\n\nBoy: Up there. He went to check something. A camp, he said. He'd be quick.\n\n''He drops his arm.''\n\nBoy: That was a long time ago.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"I'll look for him. First, let's get you somewhere warm","next":"I_ll_look_for_him__First__let_s_get_you_somewhere_warm","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"I_ll_look_for_him__First__let_s_get_you_somewhere_warm":{"id":"I_ll_look_for_him__First__let_s_get_you_somewhere_warm","type":"scene","title":"","text":"Boy: ''looks up properly for the first time''\n\nBoy: Somewhere warm?\n\n''He tries to stand and wobbles. You steady him.''\n\nBoy: ...Okay. But Papa has to know where I am.","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Bring the boy to Springvale","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Bring_the_Boy_to_Springvale","label":"Go to Springvale (Mondstadt), do /rpg and click on Bring the Boy to Springvale"}],"subScenes":[],"gateSubScenes":false},"Bring_the_Boy_to_Springvale":{"id":"Bring_the_Boy_to_Springvale","type":"scene","title":"","text":"''The boy stops shivering the moment Springvale's cookfires hit him. He looks around with wide eyes, then up at you.''\n\nBoy: It's warm here.\n\n''Draff passes with a bundle of kindling and slows, taking in the child's thin coat.''\n\nDraff: Lost, is he?\n\nBoy: ''clutching your sleeve'' I'm not lost. I'm waiting.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"He needs a place to sit by a fire","next":"He_needs_a_place_to_sit_by_a_fire","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"He_needs_a_place_to_sit_by_a_fire":{"id":"He_needs_a_place_to_sit_by_a_fire","type":"scene","title":"","text":"Draff: ''grunts'' Smokehouse has a bench. I'll put kettle water on.\n\n''He jerks his chin toward the awning.''\n\nDraff: Set him there. Tell him not to wander off again.\n\nBoy: ''to you, urgent'' You'll find Papa, right? You said you would.","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Drop the boy off somewhere warm in Springvale","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Drop_Off","label":"Do /rpg again and then click on Drop Off"}],"subScenes":[],"gateSubScenes":false},"Drop_Off":{"id":"Drop_Off","type":"scene","title":"","text":"Boy: ''wrapped in a borrowed blanket on the smokehouse bench'' I'll stay here. I promise.\n\n''He watches the kettle steam and doesn't let go of the blanket corner.''\n\nBoy: ''quietly'' Please find him.","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Search Wyrmrest Valley for the boy's father","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Search_Area","label":"Go to Wyrmrest Valley (Dragonspine), do /rpg and click on Search Area"}],"subScenes":[],"gateSubScenes":false},"Search_Area":{"id":"Search_Area","type":"scene","title":"","text":"''Higher on the trail, a canvas tent hunches against a rock shelf. The flap is tied shut, but smoke still curls from a stone ring out front. The ashes are warm when you touch them.''\n\n''Someone camped here recently. The footprints leading away angle uphill, deeper into the white.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Search further up the valley for signs of the father","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Search_Area_","label":"Wait for 3 hours, after that do /rpg again and then click on Search Area"}],"subScenes":[],"gateSubScenes":false},"Search_Area_":{"id":"Search_Area_","type":"scene","title":"","text":"''The trail narrows between frost-rimed pines. A wool scarf hangs snagged on a bramble, still damp. Boot prints overlap in the snow, two sets at first, then one, pressing hard toward the ridge.''\n\n''Farther up, something guttural echoes off the stone. Chanting. Not wind.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Search the upper trail for the father","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Search_Area__","label":"Wait for 3 hours, after that do /rpg again and then click on Search Area"}],"subScenes":[],"gateSubScenes":false},"Search_Area__":{"id":"Search_Area__","type":"scene","title":"","text":"''At a switchback below the ridge, a supply pack lies overturned in the drifts. Rations spilled. A hand axe half-buried. No blood, but the pack was dropped fast.''\n\n''The chanting is louder now, just over the next rise. And underneath it, a man's voice, hoarse and desperate.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Continue upward on the mountain trail","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Continue_Upward","label":"Wait for 3 hours, after that do /rpg again and then click on Continue Upward"}],"subScenes":[],"gateSubScenes":false},"Continue_Upward":{"id":"Continue_Upward","type":"scene","title":"","text":"''You crest the rise. A broad-shouldered man in a patched coat backs against a cliff face, one arm raised to block. Two Cryo Samachurls circle him, staffs scraping ice from the stone. A Cryo Slime bounces at his feet, leaving rime on his boots.''\n\nMan: ''spotting you'' Don't— just stay back!\n\n''One samachurl raises its staff. Frost blooms across the man's sleeve.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Fight off the Cryo Samachurls attacking the man on the slope","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Fight_the_Samachurls_Win","label":"Do /rpg again and then click on Fight the Samachurls. Defeat 2 [[Cryo Samachurl]]s and 1 [[Cryo Slime]].\nIf you defeated the enemies:","best":true},{"next":"Fight_the_Samachurls_Lose","label":"Do /rpg again and then click on Fight the Samachurls. Defeat 2 [[Cryo Samachurl]]s and 1 [[Cryo Slime]].\nIf you got defeated by the enemies:"}],"subScenes":[],"gateSubScenes":false},"Fight_the_Samachurls_Win":{"id":"Fight_the_Samachurls_Win","type":"scene","title":"","text":"''The last samachurl collapses into scattered mask and frost. The man slides down the cliff wall, breathing hard, and presses a hand to his ribs.''\n\nMan: ''disbelieving'' You... you actually came up here.\n\n''He looks at the trail behind you, then at his own shaking hands.''\n\nMan: My boy. Is he—\n\n''You tell him about Springvale. Something in his face breaks open with relief.''\n\nMan: Thank you. Gods, thank you. ''he pushes himself upright'' I'll walk. Just point me downhill.","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Return to Springvale and reunite the boy with his father","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Reunite_the_Boy_and_His_Father","label":"Go to Springvale (Mondstadt), do /rpg and click on Reunite the Boy and His Father"}],"subScenes":[],"gateSubScenes":false},"Fight_the_Samachurls_Lose":{"id":"Fight_the_Samachurls_Lose","type":"scene","title":"","text":"''You reach the rise too late. The man is on his knees in the snow, frost spreading across his coat. The samachurls scatter at your approach, but the chanting fades into wind.''\n\n''He tries to say something. Nothing comes out.''\n\n''By the time you reach him, he is still.''\n\n''Somewhere below, a boy is waiting on a smokehouse bench with a blanket and a kettle.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Decide what to do after what happened on the slope","collapsed":false}],"choices":[{"label":"There's nothing more I can do here","next":"____Waiting_for_Papa__Nothing_More_to_Do","best":false,"responseText":"","objectives":[],"itemReq":""},{"label":"I need to tell him","next":"I_need_to_tell_him","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"____Waiting_for_Papa__Nothing_More_to_Do":{"id":"____Waiting_for_Papa__Nothing_More_to_Do","type":"ending","title":"Nothing More to Do","text":"''You stand on the rise for a moment. The wind takes the last of the frost from the man's sleeve.''\n\n''Below, Springvale's smoke rises into a grey sky. A boy waits on a bench with a blanket he will not let go of.''\n\n''You turn downhill. The valley does not ask what you decided.''","embedUrl":"","embedLabel":"","dialogues":[],"choices":[],"rewards":[{"item":"Silver","qty":50,"icon":""},{"item":"AEXP","qty":100,"icon":""}],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"I_need_to_tell_him":{"id":"I_need_to_tell_him","type":"scene","title":"","text":"''The walk back to Springvale is longer than it should be.''\n\n''You rehearse words that will not fit together. At the smokehouse bench, the boy sees your face before you speak.''","embedUrl":"","embedLabel":"","dialogues":[{"speaker":"📌 Objective","text":"Return to Springvale and tell the boy what happened","collapsed":false}],"choices":[],"rewards":[],"unlocks":"","requirement":"","continues":[{"next":"Tell_the_Boy","label":"Go to Springvale (Mondstadt), do /rpg and click on Tell the Boy"}],"subScenes":[],"gateSubScenes":false},"Reunite_the_Boy_and_His_Father":{"id":"Reunite_the_Boy_and_His_Father","type":"scene","title":"","text":"''The boy is on his feet before his father clears the awning. The blanket drops. Neither of them speaks for a moment.''\n\nBoy: Papa!\n\nMan: ''dropping to one knee, wincing'' I'm here. I'm here. ''pulls him close'' I told you to wait. You waited.\n\n''The boy sobs once into his father's shoulder, then stops, as if remembering he is too old for that.''\n\nMan: ''looking up at you'' You brought him down. You came up after me. ''counts coins from a frozen pouch with stiff fingers'' It's not enough. It's what I have.\n\n''He hesitates, then unbuckles a sword from his pack. The blade is pale blue, frosted along the edge, still sharp.''\n\nMan: Cool Steel. Carried it up the mountain. ''shoves it into your hands'' Take it. I owe you more than silver for this.\n\nDraff: ''from the doorway, arms crossed'' Get inside before you freeze again. Both of you.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"Go inside","next":"____Waiting_for_Papa__Family_Reunited","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"____Waiting_for_Papa__Family_Reunited":{"id":"____Waiting_for_Papa__Family_Reunited","type":"ending","title":"Family Reunited","text":"''The smokehouse door closes on warmth and low voices. Through the window you see the boy pressed against his father's side, both of them finally still.''\n\n''Dragonspine keeps its cold. Tonight, at least one bench in Springvale does not.''","embedUrl":"","embedLabel":"","dialogues":[],"choices":[],"rewards":[{"item":"Silver","qty":500,"icon":""},{"item":"AEXP","qty":400,"icon":""},{"item":"Cool Steel","qty":0,"icon":"../Textures/Weapons/Weapon_Cool_Steel.webp"}],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"Tell_the_Boy":{"id":"Tell_the_Boy","type":"scene","title":"","text":"Boy: ''already standing'' Did you find him? Is he—\n\n''You tell him. Quietly. As plain as you can make it.''\n\n''He doesn't cry right away. He looks at the kettle. At the blanket. At the spot on the bench where he waited.''\n\nBoy: ''very small'' He told me not to move.\n\n''Then his face crumples and he sits down hard, both hands over his eyes. Draff turns away and busies himself with the kettle.''\n\nDraff: ''roughly, not unkind'' Stay as long as you need, lad.","embedUrl":"","embedLabel":"","dialogues":[],"choices":[{"label":"Leave them to it","next":"____Waiting_for_Papa__The_Hard_Truth","best":false,"responseText":"","objectives":[],"itemReq":""}],"rewards":[],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false},"____Waiting_for_Papa__The_Hard_Truth":{"id":"____Waiting_for_Papa__The_Hard_Truth","type":"ending","title":"The Hard Truth","text":"''You step back into the cold. The boy's shoulders shake once behind you, then go still.''\n\n''Some things you carry down the mountain whether you want to or not.''","embedUrl":"","embedLabel":"","dialogues":[],"choices":[],"rewards":[{"item":"Silver","qty":100,"icon":""},{"item":"AEXP","qty":150,"icon":""}],"unlocks":"","requirement":"","continues":[],"subScenes":[],"gateSubScenes":false}};
const questMeta={"requirement":"Explore Wyrmrest Valley (30%+ exploration) to trigger this quest.","locations":["[[Locations#Wyrmrest_Valley|Wyrmrest Valley]]"],"questType":"normal","customTabs":[{"id":"tip1","label":"TIP","color":"#ff0000","content":"You can click the '''Collapse''' button and the '''Best Route''' → '''Important Only''' button at the top to minimize it.\n''Some quests will not have a Best Route choice, because the best choice is subjective or not yet found.''\n\nYou can also click the '''Endings''' button at the top to view all possible endings, and clicking an ending will show the options needed to reach that ending."}],"tabOrder":["loc","req","type","ct_tip1"]};

var WIKI_BASE="https://dawnwineryrpg.miraheze.org/wiki/";
var WIKI_MODE=true;

function findPathToEnding(targetId){
  if(!scenes[targetId])return null;
  var visited={start:true};
  var queue=[["start"]];
  while(queue.length){
    var path=queue.shift();
    var id=path[path.length-1];
    if(id===targetId)return path;
    var s=scenes[id];if(!s)continue;
    var edges=[];
    (s.choices||[]).forEach(function(c){if(c.next)edges.push(c.next);});
    (s.continues||[]).forEach(function(c){if(c.next)edges.push(c.next);});
    for(var i=0;i<edges.length;i++){
      var nid=edges[i];
      if(!visited[nid]&&scenes[nid]){visited[nid]=true;queue.push(path.concat([nid]));}
    }
  }
  return null;
}

      _impHtml+="<div class=\"tcard"+(id===currentPlayId?" playing":"")+" \" id=\"tcard-"+id+"\" onclick=\"go('"+id+"')\">";
      _impHtml+="<span class=\"bbadge "+bclass+"\">"+blabel+"</span>";
      _impHtml+="<span class=\"ttitle\">"+eh(s.title)+"</span>";
      _impHtml+="</div>";
      var hasBody=s.text||s.embedUrl||(s.dialogues&&s.dialogues.length)||(s.subScenes&&s.subScenes.length)||(s.type==="ending"&&s.rewards&&s.rewards.length);
      if(hasBody){
        _impHtml+="<div class=\"tnode-body\">";
        if(s.text)_impHtml+="<div class=\"tscene-text\">"+wl(s.text)+"</div>";
        if(s.embedUrl)_impHtml+="<details class=\"tembed-wrap\"><summary>"+eh(s.embedLabel||"Embed")+"</summary><iframe src=\""+s.embedUrl.replace(/"/g,"&quot;")+"\" loading=\"lazy\" style=\"width:100%;min-height:360px;border:1px solid var(--border2);border-radius:6px;margin:4px 0 8px;display:block\"></iframe></details>";
        if(s.dialogues&&s.dialogues.length){_impHtml+="<div class=\"tdlgs\">";s.dialogues.forEach(function(d){if(d.collapsed){_impHtml+="<details><summary>"+eh(d.speaker||"Objective")+"</summary><div class=\"dlg-text\">"+wl(d.text||"")+"</div></details>";}else{_impHtml+="<div class=\"tdlg\"><span class=\"tdlg-spk\">"+eh(d.speaker||"Objective")+"</span><span class=\"tdlg-txt\">"+wl(d.text||"")+"</span></div>";}});_impHtml+="</div>";}
        _impHtml+=subScenesTreeHtml(s);
        if(s.type==="ending"&&s.rewards&&s.rewards.length){_impHtml+="<div class=\"treward-inline\"><span class=\"treward-inline-label\">🎁 Rewards</span>";s.rewards.forEach(function(r){_impHtml+="<span class=\"treward-item\">"+rewIcon(r,16)+wl(r.item)+rewQty(r)+"</span>";});_impHtml+="</div>";}
        if(s.type==="ending"&&s.unlocks){_impHtml+="<div class=\"tunlocks-inline\">🔓 Unlocks: "+wl(s.unlocks)+"</div>";}
        _impHtml+="</div>";
      }
      if(s.choices&&s.choices.length){
        var _bcs=s.choices.filter(function(c){return c.best;});
        var _vcs=_bcs.length>0?_bcs:s.choices;
        _impHtml+="<div class=\"bchoices\">";
        _vcs.forEach(function(c){
          var dest=scenes[c.next];var destLabel=dest&&dest.title?eh(dest.title):"";
          _impHtml+="<div class=\"bchoice"+(c.best?" best":"")+" \" onclick=\"go('"+c.next+"')\">";
          _impHtml+="<span class=\"bchoice-arrow\">→</span><span class=\"bchoice-label\">"+(wl(c.label)||"...")+"</span>"+(c.best?"<span class=\"best-route-badge\">⭐ Best Route</span>":"")+(destLabel?"<span class=\"bchoice-dest\">"+destLabel+"</span>":"")+((c.itemReq&&c.itemReq.trim())?"<span class=\"bchoice-itemreq\">\ud83d\udd12 "+wl(c.itemReq)+"</span>":"");
          _impHtml+="</div>";
        });
        _impHtml+="</div>";
      }
      _impHtml+="</div>";
    });
    bv.innerHTML="<div class=\"troot troot-imp\">"+(_th?"<div class=\"tnode-imp\">"+_th+"</div>":"")+_impHtml+"</div>";
  } else {
    bv.innerHTML="<div class=\"troot\">"+_th+buildTreeNode("start",true)+"</div>";
  }
  requestAnimationFrame(drawTreeLines);
}

  if(branchMode!=="tree")return;

function buildTreeNode(id,isLast,isBestDest){
  var s=scenes[id];
  if(!s)return "<div class=\"tmissing\">(missing: "+eh(id)+")</div>";
  var bclass=s.type==="start"?"b-start":s.type==="ending"?"b-ending":"b-scene";
  var blabel=s.type==="start"?"Start":s.type==="ending"?"Ending":"Scene";
  var alreadyVisited=treeVisited[id];
  treeVisited[id]=true;
  var html="<div class=\"tnode\">";
  html+="<div class=\"tcard"+(isBestDest?" tcard-best":"")+(id===currentPlayId?" playing":"")+"\" id=\"tcard-"+id+"\" onclick=\"go('"+id+"')\">";
  html+="<span class=\"bbadge "+bclass+"\">"+blabel+"</span>";
  html+="<span class=\"ttitle\">"+eh(s.title)+"</span>";
  html+="</div>";
  if(alreadyVisited){
    html+="<div class=\"tvisited\" onclick=\"jumpToTreeCard('"+id+"')\">↑ Same as: "+eh(s.title||id)+"</div>";
    html+="</div>";return html;
  }
  var hasBody=s.text||s.embedUrl||(s.dialogues&&s.dialogues.length)||(s.subScenes&&s.subScenes.length)||(s.type==="ending"&&s.rewards&&s.rewards.length);
  if(hasBody){
    html+="<div class=\"tnode-body"+(isBestDest?" tnbody-best":"")+"\">";
    if(s.text){html+="<div class=\"tscene-text\">"+wl(s.text)+"</div>";}
    if(s.embedUrl){html+="<details class=\"tembed-wrap\"><summary>"+eh(s.embedLabel||"Embed")+"</summary><iframe src=\""+s.embedUrl.replace(/"/g,"&quot;")+"\" loading=\"lazy\" style=\"width:100%;min-height:360px;border:1px solid var(--border2);border-radius:6px;margin:4px 0 8px;display:block\"></iframe></details>";}
    if(s.dialogues&&s.dialogues.length){
      html+="<div class=\"tdlgs\">";
      s.dialogues.forEach(function(d){
        if(d.collapsed){html+="<details><summary>"+eh(d.speaker||"Objective")+"</summary><div class=\"dlg-text\">"+wl(d.text||"")+"</div></details>";}
        else{html+="<div class=\"tdlg\"><span class=\"tdlg-spk\">"+eh(d.speaker||"Objective")+"</span><span class=\"tdlg-txt\">"+wl(d.text||"")+"</span></div>";}
      });
      html+="</div>";
    }
    html+=subScenesTreeHtml(s);
    if(s.type==="ending"&&s.rewards&&s.rewards.length){html+="<div class=\"treward-inline\"><span class=\"treward-inline-label\">🎁 Rewards</span>";s.rewards.forEach(function(r){html+="<span class=\"treward-item\">"+rewIcon(r,16)+wl(r.item)+rewQty(r)+"</span>";});html+="</div>";}
    if(s.type==="ending"&&s.unlocks){html+="<div class=\"tunlocks-inline\">🔓 Unlocks: "+wl(s.unlocks)+"</div>";}
    html+="</div>";
  }
  if(s.choices&&s.choices.length){
    var bestChoices=s.choices.filter(function(c){return c.best;});
    var visibleChoices=bestRouteMode>0&&bestChoices.length>0?bestChoices:s.choices;
    if(visibleChoices.length===1){
      var c1=visibleChoices[0];
      var c1Objs=(c1.objectives&&c1.objectives.length)?c1.objectives.map(function(obj){return obj.collapsed?"<details style=\"background:var(--bg3);border:1px solid var(--border);border-radius:3px;margin-top:4px;overflow:hidden\"><summary style=\"padding:4px 7px;font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;list-style:none\">"+eh(obj.speaker||"Objective")+"</summary><span style=\"display:block;padding:3px 7px 5px;font-size:11px;color:var(--text2)\">"+wl(obj.text||"")+"</span></details>":"<div class=\"tdlg\" style=\"margin-top:4px\"><span class=\"tdlg-spk\">"+eh(obj.speaker||"Objective")+"</span><span class=\"tdlg-txt\">"+wl(obj.text||"")+"</span></div>";}).join(""):"";
      html+="<div class=\"tchoice-inline\">";
      html+="<div class=\"tchoice-label"+(c1.best?" tchoice-best":"")+"\"><span class=\"tchoice-label-text\">"+(wl(c1.label)||"...")+"</span>"+(c1.best?" <span class=\"best-route-badge\">⭐ Best Route</span>":"")+((c1.itemReq&&c1.itemReq.trim())?" <span class=\"tchoice-itemreq\">🔒 "+wl(c1.itemReq)+"</span>":"")+"</div>";
      if(c1Objs)html+="<div style=\"margin:2px 0 4px\">"+c1Objs+"</div>";
      if(c1.next&&scenes[c1.next]){html+=buildTreeNode(c1.next,true,c1.best);}
      else if(c1.responseText){html+="<div style=\"font-size:13px;color:var(--text2);padding:3px 4px;line-height:1.5\">"+wl(c1.responseText)+"</div>";}
      else{html+="<div class=\"tmissing\">(no destination)</div>";}
      html+="</div>";
    } else {
      var anyBest=visibleChoices.some(function(c){return c.best;});
      html+="<div class=\"tchoices"+(anyBest?" has-best":"")+"\">";
      visibleChoices.forEach(function(c,i){
        var last=i===visibleChoices.length-1;
        var cObjs=(c.objectives&&c.objectives.length)?c.objectives.map(function(obj){return obj.collapsed?"<details style=\"background:var(--bg3);border:1px solid var(--border);border-radius:3px;margin-top:4px;overflow:hidden\"><summary style=\"padding:4px 7px;font-size:10px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;list-style:none\">"+eh(obj.speaker||"Objective")+"</summary><span style=\"display:block;padding:3px 7px 5px;font-size:11px;color:var(--text2)\">"+wl(obj.text||"")+"</span></details>":"<div class=\"tdlg\" style=\"margin-top:4px\"><span class=\"tdlg-spk\">"+eh(obj.speaker||"Objective")+"</span><span class=\"tdlg-txt\">"+wl(obj.text||"")+"</span></div>";}).join(""):"";
        html+="<div class=\"tchoice"+(last?" tchoice-last":"")+(c.best?" best-branch":"")+"\">"; 
        html+="<div class=\"tchoice-label"+(c.best?" tchoice-best":"")+"\"><span class=\"tchoice-label-text\">"+(wl(c.label)||"...")+"</span>"+(c.best?" <span class=\"best-route-badge\">⭐ Best Route</span>":"")+((c.itemReq&&c.itemReq.trim())?" <span class=\"tchoice-itemreq\">🔒 "+wl(c.itemReq)+"</span>":"")+"</div>";
        if(cObjs)html+="<div style=\"margin:2px 0 4px\">"+cObjs+"</div>";
        if(c.next&&scenes[c.next]){html+=buildTreeNode(c.next,last,c.best);}
        else if(c.responseText){html+="<div style=\"font-size:13px;color:var(--text2);padding:3px 4px;line-height:1.5\">"+wl(c.responseText)+"</div>";}
        else{html+="<div class=\"tmissing\">(no destination)</div>";}
        html+="</div>";
      });
      html+="</div>";
    }
  }
  var _bestC=s.choices?(s.choices.filter(function(c){return c.best;})):[]; 
  var _visLen=(s.choices&&s.choices.length)?(bestRouteMode>0&&_bestC.length>0?_bestC.length:s.choices.length):0;
  var _contsAll=(s.continues||[]).filter(function(c){return c.next&&scenes[c.next];});
  var _contsBest=_contsAll.filter(function(c){return c.best;});
  var _conts=(bestRouteMode>0)&&_contsBest.length>0?_contsBest:_contsAll;
  if(_conts.length>1){
    html+="<div class=\"tchoices tcontinues\" style=\"margin-top:8px\">";
    _conts.forEach(function(c,ci){
      var last=ci===_conts.length-1;
      html+="<div class=\"tchoice"+(last?" tchoice-last":"")+(c.best?" best-branch":"")+"\">";
      html+="<div class=\"tcontinue-label"+(c.best?" tchoice-best":"")+"\"><span class=\"tcontinue-label-text\">"+(c.label?wl(c.label):"Continues to")+"</span>"+(c.best?" <span class=\"best-route-badge\">⭐ Best Route</span>":"")+"</div>";
      html+=buildTreeNode(c.next,last,isBestDest||c.best);
      html+="</div>";
    });
    html+="</div>";
  } else {
    _conts.forEach(function(c){
      html+="<div class=\"tchoice-inline\" style=\"margin-top:8px\"><div class=\"tcontinue-arrow\">"+(c.label?wl(c.label):"↓")+(c.best?" <span class=\"best-route-badge\">⭐ Best Route</span>":"")+"</div>"+buildTreeNode(c.next,true,isBestDest||c.best)+"</div>";
    });
  }
  html+="</div>";return html;
}
function jumpToTreeCard(id){var el=document.getElementById("tcard-"+id);if(el)el.scrollIntoView({behavior:"smooth",block:"nearest"});}
function drawTreeLines(){
  var RED="#e03020",GREY="#cccccc",BLUE="#1a5a8a";
  document.querySelectorAll(".tchoices").forEach(function(group){
    group.querySelectorAll(":scope>.tc-vert,:scope>.tc-horiz").forEach(function(el){el.remove();});
    group.querySelectorAll(":scope>.tchoice").forEach(function(ch){
      var h=ch.querySelector(".tc-horiz");if(h)h.remove();
    });
    var choices=Array.from(group.querySelectorAll(":scope>.tchoice"));
    if(!choices.length)return;
    var isDashed=group.classList.contains("tcontinues");
    var bestIdx=-1;
    choices.forEach(function(ch,i){if(ch.classList.contains("best-branch"))bestIdx=i;});
    var groupRect=group.getBoundingClientRect();
    var prevStubY=-5;
    choices.forEach(function(ch,i){
      var chRect=ch.getBoundingClientRect();
      var stubY=chRect.top-groupRect.top+19;
      var vertColor=isDashed?((bestIdx>=0&&i<=bestIdx)?RED:BLUE):((bestIdx>=0&&i<=bestIdx)?RED:GREY);
      var horizColor=isDashed?((i===bestIdx)?RED:BLUE):((i===bestIdx)?RED:GREY);
      var horizH=(i===bestIdx&&!isDashed)?4:2;
      var vert=document.createElement("div");
      vert.className="tc-vert";
      if(isDashed){
        vert.style.cssText="top:"+prevStubY+"px;height:"+(stubY-prevStubY)+"px;width:1.5px;background:repeating-linear-gradient(to bottom,"+vertColor+" 0 2px,transparent 2px 4px)";
      } else {
        vert.style.cssText="top:"+prevStubY+"px;height:"+(stubY-prevStubY)+"px;background:"+vertColor;
      }
      group.appendChild(vert);
      var horiz=document.createElement("div");
      horiz.className="tc-horiz";
      if(isDashed){
        horiz.style.cssText="top:"+(19-(horizH===4?1:0))+"px;height:"+horizH+"px;background:repeating-linear-gradient(to right,"+horizColor+" 0 2px,transparent 2px 4px)";
      } else {
        horiz.style.cssText="top:"+(19-(horizH===4?1:0))+"px;height:"+horizH+"px;background:"+horizColor;
      }
      ch.appendChild(horiz);
      prevStubY=stubY;
    });
  });
}
